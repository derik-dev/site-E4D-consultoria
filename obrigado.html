<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagem enviada — E4D Consultoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0D182E;
      color: #F5F5F3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      text-align: center;
      max-width: 520px;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 32px;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    h1 span { color: #C9A84C; }
    p {
      font-size: 1rem;
      line-height: 1.7;
      color: rgba(245,245,243,0.7);
      margin-bottom: 40px;
    }
    a {
      display: inline-block;
      padding: 14px 32px;
      background: #C9A84C;
      color: #0D182E;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 4px;
      letter-spacing: 0.03em;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Mensagem <span>enviada</span> com sucesso!</h1>
    <p>Recebemos o seu contato e em breve um especialista da E4D Consultoria entrará em contato com você.</p>
    <a href="/">Voltar ao site</a>
  </div>
</body>
</html>
